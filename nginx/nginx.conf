worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;
events { worker_connections 128; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        location /media/ {
            alias C:/path/to/LiveCaption/media/;
            autoindex off;
        }
    }
}
