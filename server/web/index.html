<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveCaption</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
</head>
<body>
<header class="top">
  <form id="start-form" class="source" autocomplete="off">
    <input id="url" type="url" required placeholder="YouTube 라이브 주소 (예: https://www.youtube.com/@ytnnews24/live)" aria-label="영상 주소">
    <select id="language" aria-label="인식 언어">
      <option value="ko">한국어</option>
      <option value="">자동 감지</option>
      <option value="en">영어</option>
      <option value="ja">일본어</option>
      <option value="zh">중국어</option>
    </select>
    <label class="check"><input id="diarization" type="checkbox"> 화자 구분</label>
    <button id="start" class="primary" type="submit">재생 + AI 자막</button>
    <button id="stop" type="button" disabled>정지</button>
  </form>
</header>

<main class="layout">
  <section class="stage" id="stage">
    <video id="video" playsinline></video>
    <div id="placeholder" class="placeholder">YouTube 라이브 주소를 넣고 <b>재생 + AI 자막</b>을 누르세요</div>
    <button id="unmute" class="unmute" type="button" hidden>소리 켜기</button>
    <div id="caption" class="caption" aria-live="polite"></div>
    <div class="controls" id="controls">
      <button id="play" type="button" title="재생 / 일시정지 (Space)">▶</button>
      <span id="live-badge" class="badge" hidden>LIVE</span>
      <span id="clock" class="clock"></span>
      <span class="spacer"></span>
      <button id="cc" type="button" class="on" title="자막 표시 (C)">CC</button>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="음량">
      <button id="fullscreen" type="button" title="전체 화면 (F)">⛶</button>
    </div>
  </section>

  <aside class="panel">
    <div class="status"><span id="dot" class="dot"></span><span id="status">대기 중</span></div>
    <div id="title" class="title"></div>

    <section class="group">
      <h2>싱크</h2>
      <p class="hint">자막은 서버가 잰 말한 시각에 맞춰 자동으로 표시됩니다. 남는 차이만 미세 조정하세요.</p>
      <div class="row">
        <strong id="offset-label" class="offset">+0.0초</strong>
        <button type="button" data-nudge="-500">−0.5</button>
        <button type="button" data-nudge="-100">−0.1</button>
        <button type="button" data-nudge="100">+0.1</button>
        <button type="button" data-nudge="500">+0.5</button>
        <button type="button" id="offset-reset">초기화</button>
      </div>
      <p class="hint">− 자막을 빠르게 · ＋ 자막을 늦게 (단축키 G / H)</p>
      <label class="row">자막 대기 여유
        <input id="margin" type="range" min="4" max="20" step="1" value="8">
        <span id="margin-label">8초</span>
      </label>
      <p class="hint">영상을 라이브보다 이만큼 늦게 재생해, 늦게 인식된 자막도 제때 나오게 합니다.</p>
      <dl class="stats">
        <dt>인식 지연</dt><dd id="lag">–</dd>
        <dt>영상 지연</dt><dd id="latency">–</dd>
      </dl>
    </section>

    <section class="group grow">
      <h2>자막 <span class="hint">(클릭하면 그 장면으로 이동)</span></h2>
      <ol id="list" class="list"></ol>
    </section>

    <section class="group">
      <div class="row">
        <label class="row">글자 크기 <input id="size" type="range" min="16" max="48" value="28"></label>
        <a id="srt" class="button disabled" download>SRT</a>
        <a id="vtt" class="button disabled" download>WebVTT</a>
      </div>
      <details>
        <summary>서버</summary>
        <input id="server" type="text" aria-label="서버 주소" placeholder="192.168.0.10:8000">
      </details>
    </section>
  </aside>
</main>
<script src="player.js"></script>
</body>
</html>
